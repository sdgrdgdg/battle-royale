```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Battle Royale</title>
<style>
  * { box-sizing:border-box; }
  body {
    margin:0;
    overflow:hidden;
    background:#10151c;
    font-family:Arial,sans-serif;
    color:white;
    user-select:none;
  }
  canvas {
    display:block;
    background:#6dbb55;
    cursor:crosshair;
  }
  #hud {
    position:fixed;
    top:15px;
    left:15px;
    z-index:2;
    pointer-events:none;
    text-shadow:2px 2px #000;
  }
  #title { font-size:22px;font-weight:bold;margin-bottom:7px; }
  #health {
    width:220px;height:20px;
    background:#222;border:2px solid #111;border-radius:5px;
    overflow:hidden;
  }
  #hpbar { height:100%;background:#38d66b;width:100%; }
  #info { margin-top:7px;font-size:14px; }
  #message {
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.48);
    z-index:5;
    text-align:center;
  }
  #message h1 { font-size:54px;margin:0 0 12px; }
  #message p { font-size:20px; }
  button {
    padding:12px 25px;
    font-size:18px;
    border:0;
    border-radius:8px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="title">MINI BATTLE ROYALE</div>
  <div id="health"><div id="hpbar"></div></div>
  <div id="info"></div>
</div>

<div id="message">
  <h1 id="result"></h1>
  <p id="resultText"></p>
  <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize",resize);
resize();

const WORLD = 2400;

const keys = {};
const mouse = {x:0,y:0,down:false};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()] = true;
  if(e.key === " "){ e.preventDefault(); }
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()] = false);

canvas.addEventListener("mousemove",e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});
canvas.addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

function rand(a,b){return Math.random()*(b-a)+a;}
function dist(a,b,c,d){return Math.hypot(a-c,b-d);}

const player = {
  x:WORLD/2,
  y:WORLD/2,
  r:17,
  speed:245,
  hp:100,
  maxHp:100,
  alive:true,
  cooldown:0,
  kills:0,
  color:"#35a7ff"
};

const bots=[];
const bullets=[];
const loot=[];
const trees=[];
const rocks=[];

function safePoint(){
  return {
    x:rand(180,WORLD-180),
    y:rand(180,WORLD-180)
  };
}

// Decorative map objects
for(let i=0;i<130;i++){
  const p=safePoint();
  trees.push({x:p.x,y:p.y,r:rand(16,28)});
}
for(let i=0;i<70;i++){
  const p=safePoint();
  rocks.push({x:p.x,y:p.y,r:rand(9,18)});
}

// Loot
for(let i=0;i<55;i++){
  const p=safePoint();
  loot.push({
    x:p.x,y:p.y,
    type:Math.random()<.7 ? "ammo" : "medkit",
    taken:false
  });
}

// Bots
for(let i=0;i<17;i++){
  let p;
  do p=safePoint();
  while(dist(p.x,p.y,player.x,player.y)<350);

  bots.push({
    x:p.x,y:p.y,
    r:16,
    hp:100,
    alive:true,
    speed:rand(90,140),
    cooldown:rand(.2,1),
    angle:rand(0,Math.PI*2),
    wander:rand(1,4),
    color:["#e74c3c","#f39c12","#9b59b6","#1abc9c"][i%4]
  });
}

// Camera
let camera={x:0,y:0};

// Storm
let storm = {
  x:WORLD/2,
  y:WORLD/2,
  start:1050,
  radius:1050,
  target:140,
  shrinkTime:150,
  elapsed:0
};

let gameTime=0;
let gameOver=false;

function shoot(owner, angle){
  bullets.push({
    x:owner.x + Math.cos(angle)*owner.r,
    y:owner.y + Math.sin(angle)*owner.r,
    vx:Math.cos(angle)*720,
    vy:Math.sin(angle)*720,
    owner,
    life:1.2,
    damage:25
  });
}

function playerShoot(){
  if(player.cooldown>0)return;

  const worldMouseX=mouse.x+camera.x;
  const worldMouseY=mouse.y+camera.y;
  const angle=Math.atan2(worldMouseY-player.y,worldMouseX-player.x);

  shoot(player,angle);
  player.cooldown=.18;
}

function updatePlayer(dt){
  if(!player.alive)return;

  let dx=0,dy=0;
  if(keys["w"]||keys["arrowup"])dy--;
  if(keys["s"]||keys["arrowdown"])dy++;
  if(keys["a"]||keys["arrowleft"])dx--;
  if(keys["d"]||keys["arrowright"])dx++;

  if(dx||dy){
    const len=Math.hypot(dx,dy);
    dx/=len;dy/=len;
    player.x+=dx*player.speed*dt;
    player.y+=dy*player.speed*dt;
  }

  player.x=Math.max(25,Math.min(WORLD-25,player.x));
  player.y=Math.max(25,Math.min(WORLD-25,player.y));

  player.cooldown-=dt;

  if(mouse.down || keys[" "]) playerShoot();

  // Pick up loot
  for(const item of loot){
    if(item.taken)continue;

    if(dist(player.x,player.y,item.x,item.y)<30){
      item.taken=true;

      if(item.type==="medkit"){
        player.hp=Math.min(player.maxHp,player.hp+35);
      }
    }
  }

  // Storm damage
  if(dist(player.x,player.y,storm.x,storm.y)>storm.radius){
    player.hp-=12*dt;
  }

  if(player.hp<=0){
    player.hp=0;
    player.alive=false;
    endGame(false);
  }
}

function updateBots(dt){
  for(const bot of bots){
    if(!bot.alive)continue;

    bot.cooldown-=dt;
    bot.wander-=dt;

    const d=dist(bot.x,bot.y,player.x,player.y);

    // Chase player when close
    if(player.alive && d<650){
      bot.angle=Math.atan2(player.y-bot.y,player.x-bot.x);

      if(d>280){
        bot.x+=Math.cos(bot.angle)*bot.speed*dt;
        bot.y+=Math.sin(bot.angle)*bot.speed*dt;
      }

      if(d<550 && bot.cooldown<=0){
        // Slight aim error
        const aim=bot.angle+rand(-.12,.12);
        shoot(bot,aim);
        bot.cooldown=rand(.55,.95);
      }
    } else {
      if(bot.wander<=0){
        bot.angle=rand(0,Math.PI*2);
        bot.wander=rand(1,3);
      }

      bot.x+=Math.cos(bot.angle)*bot.speed*.45*dt;
      bot.y+=Math.sin(bot.angle)*bot.speed*.45*dt;
    }

    bot.x=Math.max(25,Math.min(WORLD-25,bot.x));
    bot.y=Math.max(25,Math.min(WORLD-25,bot.y));

    if(dist(bot.x,bot.y,storm.x,storm.y)>storm.radius){
      bot.hp-=12*dt;
    }

    if(bot.hp<=0){
      bot.alive=false;
      player.kills++;
    }
  }
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.life-=dt;

    let remove =
      b.life<=0 ||
      b.x<0 || b.x>WORLD ||
      b.y<0 || b.y>WORLD;

    if(!remove){
      // Hit player
      if(b.owner!==player && player.alive &&
         dist(b.x,b.y,player.x,player.y)<player.r+5){
        player.hp-=b.damage;
        remove=true;

        if(player.hp<=0){
          player.hp=0;
          player.alive=false;
          endGame(false);
        }
      }
    }

    if(!remove){
      // Hit bots
      for(const bot of bots){
        if(!bot.alive || b.owner===bot)continue;

        if(dist(b.x,b.y,bot.x,bot.y)<bot.r+5){
          bot.hp-=b.damage;
          remove=true;

          if(bot.hp<=0){
            bot.alive=false;
            if(b.owner===player)player.kills++;
          }
          break;
        }
      }
    }

    if(remove) bullets.splice(i,1);
  }
}

function updateStorm(dt){
  storm.elapsed+=dt;

  const progress=Math.min(storm.elapsed/storm.shrinkTime,1);
  storm.radius=storm.start+(storm.target-storm.start)*progress;
}

function checkWin(){
  const aliveBots=bots.filter(b=>b.alive).length;

  if(player.alive && aliveBots===0){
    endGame(true);
  }
}

function endGame(win){
  if(gameOver)return;
  gameOver=true;

  document.getElementById("message").style.display="flex";
  document.getElementById("result").textContent=win ? "🏆 VICTORY!" : "💀 ELIMINATED";
  document.getElementById("resultText").textContent=
    win
    ? `You won with ${player.kills} eliminations!`
    : `You scored ${player.kills} eliminations.`;
}

function drawGround(){
  ctx.fillStyle="#72bd59";
  ctx.fillRect(0,0,WORLD,WORLD);

  // Grass patches
  ctx.fillStyle="rgba(40,130,60,.12)";
  for(let x=0;x<WORLD;x+=80){
    for(let y=0;y<WORLD;y+=80){
      if((x/80+y/80)%2===0)
        ctx.fillRect(x,y,80,80);
    }
  }

  // Roads
  ctx.fillStyle="#d2b477";
  ctx.fillRect(0,1120,WORLD,130);
  ctx.fillRect(1130,0,140,WORLD);

  ctx.fillStyle="#c6a56c";
  for(let x=0;x<WORLD;x+=55){
    ctx.fillRect(x,1180,28,5);
  }
  for(let y=0;y<WORLD;y+=55){
    ctx.fillRect(1195,y,5,28);
  }
}

function drawTrees(){
  for(const t of trees){
    ctx.fillStyle="#7b4e2b";
    ctx.fillRect(t.x-5,t.y,10,20);

    ctx.fillStyle="#23783c";
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#318f48";
    ctx.beginPath();
    ctx.arc(t.x-6,t.y-5,t.r*.65,0,Math.PI*2);
    ctx.fill();
  }

  for(const r of rocks){
    ctx.fillStyle="#70777a";
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.fill();
  }
}

function drawLoot(){
  for(const item of loot){
    if(item.taken)continue;

    ctx.fillStyle=item.type==="medkit" ? "#e94b4b" : "#f1c40f";
    ctx.fillRect(item.x-10,item.y-10,20,20);

    ctx.fillStyle="#fff";

    if(item.type==="medkit"){
      ctx.fillRect(item.x-3,item.y-7,6,14);
      ctx.fillRect(item.x-7,item.y-3,14,6);
    } else {
      ctx.fillRect(item.x-6,item.y-4,12,8);
    }
  }
}

function drawCharacter(c,isPlayer=false){
  ctx.save();
  ctx.translate(c.x,c.y);

  // Shadow
  ctx.fillStyle="rgba(0,0,0,.2)";
  ctx.beginPath();
  ctx.ellipse(3,8,c.r,c.r*.45,0,0,Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle=c.color;
  ctx.beginPath();
  ctx.arc(0,0,c.r,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#18202a";
  ctx.lineWidth=3;
  ctx.stroke();

  // Direction
  let angle=0;

  if(isPlayer){
    angle=Math.atan2(mouse.y+camera.y-c.y,mouse.x+camera.x-c.x);
  }

  ctx.rotate(angle);

  ctx.fillStyle="#333";
  ctx.fillRect(8,-4,23,8);

  ctx.fillStyle="#eee";
  ctx.beginPath();
  ctx.arc(-5,-5,3,0,Math.PI*2);
  ctx.arc(-5,5,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  // Health
  if(!isPlayer){
    ctx.fillStyle="#222";
    ctx.fillRect(c.x-18,c.y-28,36,5);

    ctx.fillStyle="#ff4b4b";
    ctx.fillRect(c.x-18,c.y-28,36*Math.max(0,c.hp/100),5);
  }
}

function drawBullets(){
  for(const b of bullets){
    ctx.fillStyle="#fff5a0";
    ctx.beginPath();
    ctx.arc(b.x,b.y,4,0,Math.PI*2);
    ctx.fill();
  }
}

function drawStorm(){
  ctx.save();

  // Outside storm
  ctx.fillStyle="rgba(89,65,180,.42)";
  ctx.beginPath();
  ctx.rect(0,0,WORLD,WORLD);
  ctx.arc(storm.x,storm.y,storm.radius,0,Math.PI*2,true);
  ctx.fill("evenodd");

  ctx.strokeStyle="#bca8ff";
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.arc(storm.x,storm.y,storm.radius,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  camera.x=player.x-canvas.width/2;
  camera.y=player.y-canvas.height/2;

  camera.x=Math.max(0,Math.min(WORLD-canvas.width,camera.x));
  camera.y=Math.max(0,Math.min(WORLD-canvas.height,camera.y));

  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  drawGround();
  drawLoot();
  drawTrees();
  drawBullets();

  for(const bot of bots){
    if(bot.alive)drawCharacter(bot);
  }

  if(player.alive)drawCharacter(player,true);

  drawStorm();

  ctx.restore();

  const alive=bots.filter(b=>b.alive).length+(player.alive?1:0);

  document.getElementById("info").innerHTML =
    `Players alive: <b>${alive}</b> &nbsp; | &nbsp; Eliminations: <b>${player.kills}</b>`;

  document.getElementById("hpbar").style.width =
    `${player.hp}%`;
}

let last=performance.now();

function loop(now){
  const dt=Math.min((now-last)/1000,.033);
  last=now;

  if(!gameOver){
    gameTime+=dt;
    updatePlayer(dt);
    updateBots(dt);
    updateBullets(dt);
    updateStorm(dt);
    checkWin();
  }

  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
